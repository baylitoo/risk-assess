# Internal Control Catalog v1
# 20 controls covering all FindingCategory values.
# taxonomy_ref is the audit primary key; stable IDs are derived from it at runtime.

- taxonomy_ref: "CTL-NET-001"
  name: "Network Segmentation"
  description: "Enforce network zone boundaries and restrict lateral movement between segments."
  framework_refs:
    nist_csf: "PR.AC-5"
    iso_27001: "A.13.1"
    dora_article: "Art. 9.2"
  applicable_categories:
    - network
    - vulnerability
  strength_when_present: "strong"

- taxonomy_ref: "CTL-NET-002"
  name: "Firewall and ACL Management"
  description: "Maintain stateful firewall rules and access control lists at all trust boundaries."
  framework_refs:
    nist_csf: "PR.AC-5"
    iso_27001: "A.13.1.3"
  applicable_categories:
    - network
  strength_when_present: "moderate"

- taxonomy_ref: "CTL-VUL-001"
  name: "Vulnerability Management Programme"
  description: "Continuous scan, triage, and remediation of known vulnerabilities on all assets."
  framework_refs:
    nist_csf: "ID.RA-1"
    iso_27001: "A.12.6.1"
    dora_article: "Art. 9.4"
    pci_dss: "Req 6.3"
  applicable_categories:
    - vulnerability
  strength_when_present: "strong"

- taxonomy_ref: "CTL-VUL-002"
  name: "Patch Management"
  description: "Apply security patches to operating systems, middleware, and applications within defined SLAs."
  framework_refs:
    nist_csf: "PR.IP-12"
    iso_27001: "A.12.6.1"
    dora_article: "Art. 9.4"
  applicable_categories:
    - vulnerability
  strength_when_present: "moderate"

- taxonomy_ref: "CTL-ACC-001"
  name: "Least Privilege Enforcement"
  description: "Restrict user and service account permissions to the minimum required for their function."
  framework_refs:
    nist_csf: "PR.AC-4"
    iso_27001: "A.9.2.3"
    dora_article: "Art. 9.4"
    pci_dss: "Req 7.1"
  applicable_categories:
    - access_management
  strength_when_present: "strong"

- taxonomy_ref: "CTL-ACC-002"
  name: "Multi-Factor Authentication"
  description: "Require MFA for all privileged access and remote access to critical systems."
  framework_refs:
    nist_csf: "PR.AC-7"
    iso_27001: "A.9.4.2"
    dora_article: "Art. 9.2"
  applicable_categories:
    - access_management
  strength_when_present: "strong"

- taxonomy_ref: "CTL-ACC-003"
  name: "Privileged Access Management"
  description: "Manage, monitor, and audit all privileged account activity using a PAM solution."
  framework_refs:
    nist_csf: "PR.AC-1"
    iso_27001: "A.9.2.6"
  applicable_categories:
    - access_management
  strength_when_present: "moderate"

- taxonomy_ref: "CTL-ABU-001"

[project]
name = "riskos"
version = "0.1.0"
description = "Evidence-backed IT risk assessment platform for regulated environments"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "liteparse>=2.0.7",
    "pypdfium2>=5.0",
    "python-docx>=1.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
riskctl = "riskos.cli.riskctl:main"
riskeval = "riskos.cli.riskeval:main"
riskfindingeval = "riskos.cli.riskfindingeval:main"
riskingest = "riskos.cli.riskingest:main"
riskinventory = "riskos.cli.riskinventory:main"
riskintake = "riskos.cli.riskintake:main"
riskreview = "riskos.cli.riskreview:main"
riskpublish = "riskos.cli.riskpublish:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "riskos"
version = "0.1.0"
description = "Evidence-backed IT risk assessment platform for regulated environments"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
riskctl = "riskos.cli.riskctl:main"
riskeval = "riskos.cli.riskeval:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
